{% extends 'base.html' %}

{% block title %}Editar Usuario{% endblock %}

{% block content %}
<h1>Editar Usuario</h1>
<form method="post">
    {% csrf_token %}
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" value="{{ usuario.user.username }}" required><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ usuario.user.email }}" required><br>
    <label for="address">Address:</label>
    <input type="text" id="address" name="address" value="{{ usuario.address }}" required><br>
    <label for="phone">Phone:</label>
    <input type="text" id="phone" name="phone" value="{{ usuario.phone }}" required><br>
    <button type="submit">Actualizar</button>
</form>
{% endblock %}
