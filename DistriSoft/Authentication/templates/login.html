<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center alig-items-center vh-10" style="width: 100%; padding: 5rem; background-color: #474b50;">
    <div class="container p-4 bg-white shadow rounded" style="max-width: 400px; max-height: 450px;">
        <div class="justify-content-center" style="width: 80px; height: 80px; border-radius: 50%; background: #E0E0E0; margin: -10px auto 20px; display: flex; justify-content: center; align-items: center;">
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User Icon" width="50">
        </div>
        <strong><p class="text-primary fs-1 text-center mb-4">Bienvenido</p></strong>
        <form action="{% url 'login_auth' %}" method="post">
            {% csrf_token %}
            <!--<form class="needs-validation" novalidate>-->
                <div class="row g-3">
                    <div class="d-flex justify-content-center">
                        <input type="text" class="form-control w-30" placeholder="Usuario" style="width: 70%;" id="username" name="username" required>
                    </div>
                    <div class="d-flex justify-content-center">
                        <input type="password" class="form-control w-30" placeholder="Contraseña" style="width: 70%;" id="password" name="password" required> <!--pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"-->
                        <!--<div class="invalid-feedback"> Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.</div>-->
                    </div>
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary mt-3">Iniciar Sesión</button>
                    </div>
                </div>
            <!--</form>-->
        </form>
    </div>
</body>
</html>
