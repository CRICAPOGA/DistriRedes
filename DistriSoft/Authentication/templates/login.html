<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(to bottom right, #65706a, #434e47);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 3rem;
            text-align: center;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #E0E0E0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: -10px auto 20px;
        }
        .form-control {
            padding: 10px 40px 10px 10px;
            border-radius: 5px;
        }
        .input-group-text {
            background: transparent;
            border: none;
        }
        .btn-login {
            background: #002F6C;
            color: white;
            width: 50%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 5px;
        }
        .btn-login:hover {
            background: #001F4D;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="avatar">
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User Icon" width="50">
        </div>
        <strong><p class="text-primary fs-1 text-center mb-4">Bienvenido</p></strong>
        <form action="{% url 'login_auth' %}" method="post">
            {% csrf_token %}
            <div class="mb-3 input-group">
                <input type="text" class="form-control" placeholder="Usuario" id="username" name="username" required>
                <span class="input-group-text"><i class="bi bi-person"></i></span>
            </div>
            <div class="mb-3 input-group">
                <input type="password" class="form-control" placeholder="Contraseña" id="password" name="password" required>
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
