<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
         body {
            background: linear-gradient(to bottom right, #002F6C, #00417e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

</head>
<body class="d-flex justify-content-center alig-items-center vh-100" style="width: 100%; padding: 5rem;">
    <div class="container p-4 bg-white shadow rounded" style="max-width: 600px; max-height: 450px;">
    <strong><p class="text-success fs-2 text-center mb-4">Registro de Usuario</p></strong>
    <form method="post" action="{% url 'register' %}">
        {% csrf_token %}
    <div class="row g-3">
        <div class="col-md-6">  
            <label for="username" class="form-label">Nombre de usuario:</label>
            <input type="text" class="form-control" style="width: 70%;" id="username" name="username" required>
        </div>
        <div class="col-md-6">
            <label for="password" class="form-label">Contraseña:</label>
            <input type="password" class="form-control" style="width: 70%;" id="password" name="password" required>
        </div>
        <div class="col-md-6">
            <label for="email" class="form-label">Correo Electrónico:</label>
            <input type="email" class="form-control" style="width: 70%;" id="email" name="email" required>
        </div>
        <div class="col-md-6">
            <label for="phone" class="form-label">Teléfono:</label>
            <input type="text" class="form-control" style="width: 70%;" id="phone" name="phone" required>
        </div>  
        <div class="col-md-6">
            <label for="address" class="form-label">Dirección:</label>
            <input type="text" class="form-control" style="width: 90%;" id="address" name="address" required>
        </div>
        <div class="col-12 text-center">
            <button type="submit" class="btn btn-success" style="width: 30%; text-align: center;" >Registrarse</button>
        </div>
    </div>
</form>
</div>
</body>
</html>
