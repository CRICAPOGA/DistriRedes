{% extends 'base.html' %}

{% block title %}Crear Producto{% endblock %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 px-3" 
     style="background: linear-gradient(135deg, #007bff, #28a745);">
    <div class="card shadow-lg bg-white rounded-4 p-4 m-4 col-lg- col-md-6 col-sm-10 d-flex flex-column flex-grow-1">
        <h2 class="text-center text-primary fw-bold mb-4">Crear Producto</h2>
        <hr class="border-1 opacity-75">
        <form method="post" enctype="multipart/form-data" class="d-flex flex-column flex-grow-1">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_name" class="form-label text-dark fw-bold">Nombre:</label>
                <input type="text" id="id_name" name="name" class="form-control border-primary" required>
            </div>

            <div class="mb-3">
                <label for="id_description" class="form-label text-dark fw-bold">Descripción:</label>
                <textarea id="id_description" name="description" class="form-control border-primary" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label for="id_category" class="form-label text-dark fw-bold d-block">Categoría:</label>
                <select id="id_category" name="category" class="form-select border-primary" required>
                    <option value="" disabled selected>Selecciona una categoría</option>
                    {% for categoria in categorias %}
                        <option value="{{ categoria.id }}">{{ categoria.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="id_image" class="form-label text-dark fw-bold">Imagen:</label>
                <input type="file" id="id_image" name="image" class="form-control border-primary">
            </div>

            <div class="d-flex justify-content-center flex-wrap mt-4">
                <a href="{% url 'productos' %}" class="btn btn-danger px-4 mx-2 fw-bold shadow">Cancelar</a>
                <button type="submit" class="btn btn-success px-4 mx-2 fw-bold shadow">Crear Producto</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
