{% extends 'base.html' %}

{% block title %}Eliminar Servicio{% endblock %}

{% block content %}
    <h1>Eliminar Servicio</h1>
    <p>¿Estás seguro de que deseas eliminar el servicio "{{ servicio.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'servicios' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
