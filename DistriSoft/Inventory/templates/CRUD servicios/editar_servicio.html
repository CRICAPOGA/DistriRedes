{% extends 'base.html' %}

{% block title %}Editar Servicio{% endblock %}

{% block content %}
    <h1>Editar Servicio</h1>
    <form method="post">
        {% csrf_token %}
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" value="{{ servicio.name }}" required><br>
        <label for="description">Descripción:</label>
        <textarea id="description" name="description" required>{{ servicio.description }}</textarea><br>
        <label for="price">Precio:</label>
        <input type="number" id="price" name="price" step="0.01" value="{{ servicio.price }}" required><br>
        <button type="submit" class="btn btn-primary">Actualizar</button>
    </form>
{% endblock %}
