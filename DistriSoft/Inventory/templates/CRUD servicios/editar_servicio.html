{% extends 'base.html' %}

{% block title %}Editar Servicio{% endblock %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 px-3" 
     style="background: linear-gradient(135deg, #007bff, #28a745);">
    <div class="card shadow-lg bg-white rounded-4 p-4 m-4 col-lg-5 col-md-6 col-sm-10 d-flex flex-column flex-grow-1">
        <h2 class="text-center text-primary fw-bold mb-4">Editar Servicio</h2>
        <hr class="border-1 opacity-75">
        <form method="post" enctype="multipart/form-data" class="d-flex flex-column flex-grow-1">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_name" class="form-label text-dark fw-bold">Nombre:</label>
                <input type="text" id="id_name" name="name" class="form-control border-primary" 
                       value="{{ servicio.name }}" required>
            </div>

            <div class="mb-3">
                <label for="id_description" class="form-label text-dark fw-bold">Descripción:</label>
                <textarea id="id_description" name="description" class="form-control border-primary" rows="3" required>{{ servicio.description }}</textarea>
            </div>

            <div class="mb-3">
                <label for="id_price" class="form-label text-dark fw-bold">Precio:</label>
                <input type="number" id="id_price" name="price" step="0.01" class="form-control border-primary" 
                       value="{{ servicio.price }}" required>
            </div>

            <div class="d-flex justify-content-center flex-wrap mt-4">
                <a href="{% url 'servicios' %}" class="btn btn-danger px-4 mx-2 fw-bold shadow">Cancelar</a>
                <button type="submit" class="btn btn-success px-4 mx-2 fw-bold shadow">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
